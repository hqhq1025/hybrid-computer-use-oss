[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-computer-use"
dynamic = ["version"]
description = "Hybrid AX, GUI, shell, file, and browser integration for OSWorld"
requires-python = ">=3.10"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "licenses/*", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
dependencies = [
  "docker>=7",
  "requests>=2.31",
  "urllib3>=2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["hcu*"]

[tool.setuptools.package-data]
"hcu.osworld" = ["guest_files/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
