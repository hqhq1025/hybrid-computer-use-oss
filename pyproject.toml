[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-computer-use-oss"
version = "0.14.0"
description = "Hybrid AX, GUI, shell, file, and browser integration for OSWorld"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "docker>=7",
  "requests>=2.31",
  "urllib3>=2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
